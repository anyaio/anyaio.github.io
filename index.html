  <dialog id="lightbox" aria-label="Image viewer" class="m-auto max-h-dvh max-w-none bg-transparent p-4 text-neutral-300 sm:p-8">

  <script>
    const smooth = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'
    const clamp = (n, max) => Math.max(0, Math.min(n, max))

    // Slideshows: touch and trackpad scroll natively, a mouse can drag, arrows and keys step.
    document.querySelectorAll('[data-slideshow]').forEach(show => {
      const list = show.querySelector('[data-slides]')
      const slides = [...list.children]
      const last = slides.length - 1
      const prev = show.querySelector('[data-prev]')
      const next = show.querySelector('[data-next]')
      const count = show.querySelector('[data-count]')

      const current = () => {
        // The last slide can't reach the left edge, so the end of the scroll counts as last.
        if (list.scrollLeft >= list.scrollWidth - list.clientWidth - 2) return last
        let best = 0
        slides.forEach((s, i) => {
          if (Math.abs(s.offsetLeft - list.scrollLeft) < Math.abs(slides[best].offsetLeft - list.scrollLeft)) best = i
        })
        return best
      }
      const go = i => list.scrollTo({ left: slides[clamp(i, last)].offsetLeft, behavior: smooth })
      const update = () => {
        const i = current()
        count.textContent = `${i + 1} / ${slides.length}`
        prev.disabled = i === 0
        next.disabled = i === last
      }

      prev.addEventListener('click', () => go(current() - 1))
      next.addEventListener('click', () => go(current() + 1))
      list.addEventListener('scroll', update, { passive: true })
      list.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') { e.preventDefault(); go(current() - 1) }
        if (e.key === 'ArrowRight') { e.preventDefault(); go(current() + 1) }
      })
      update()

      // Mouse drag to flick. Snap is off during the drag so the slides follow the pointer.
      let drag = null
      let justDragged = false
      list.addEventListener('pointerdown', e => {
        if (e.pointerType === 'mouse' && e.button === 0) drag = { x: e.clientX, left: list.scrollLeft, from: current(), moved: false }
      })
      addEventListener('pointermove', e => {
        if (!drag) return
        const dx = e.clientX - drag.x
        if (!drag.moved && Math.abs(dx) < 6) return
        drag.moved = true
        list.style.scrollSnapType = 'none'
        list.style.cursor = 'grabbing'
        list.scrollLeft = drag.left - dx
      })
      addEventListener('pointerup', e => {
        if (!drag) return
        const { moved, x, from } = drag
        drag = null
        if (!moved) return
        list.style.cursor = ''
        const dx = e.clientX - x
        go(Math.abs(dx) > 40 ? from - Math.sign(dx) : from)
        setTimeout(() => { list.style.scrollSnapType = '' }, 450)
        justDragged = true
        setTimeout(() => { justDragged = false }, 50)
      })
      // A drag ends in a click on the slide under the pointer: don't open it.
      list.addEventListener('click', e => {
        if (justDragged) { e.stopPropagation(); e.preventDefault() }
      }, { capture: true })
    })

    // Lightbox: opens any image large and steps through its project.
    const box = document.getElementById('lightbox')
    const part = name => box.querySelector(`[data-lb-${name}]`)
    let items = []
    let at = 0
    const show = i => {
      at = (i + items.length) % items.length
      const { full, title, desc, meta } = items[at].dataset
      part('img').src = full
      part('img').alt = desc ? `${title}, ${desc}` : title
      part('title').textContent = title
      part('desc').textContent = desc ? `— ${desc}` : ''
      part('meta').textContent = meta
      part('count').textContent = `${at + 1} / ${items.length}`
    }
    document.addEventListener('click', e => {
      const open = e.target.closest('[data-full]')
      if (open) {
        items = [...open.closest('[data-project]').querySelectorAll('[data-full]')]
        show(items.indexOf(open))
        return box.showModal()
      }
      if (e.target === box) box.close() // click outside the image closes it
    })
    part('prev').addEventListener('click', () => show(at - 1))
    part('next').addEventListener('click', () => show(at + 1))
    box.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') show(at - 1)
      if (e.key === 'ArrowRight') show(at + 1)
    })
    // Swipe on the open image.
    let touchX = null
    part('img').addEventListener('pointerdown', e => { touchX = e.clientX })
    part('img').addEventListener('pointerup', e => {
      if (touchX === null) return
      const dx = e.clientX - touchX
      touchX = null
      if (Math.abs(dx) > 40) show(at - Math.sign(dx))
    })
  </script>
